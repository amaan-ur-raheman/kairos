<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos · Aurora — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Direction C "Aurora" — premium dark & glassy ─────────────── */
  :root {
    --void:#0b0a14; --navy:#14122b;
    --glass:rgba(255,255,255,.055); --glass-strong:rgba(255,255,255,.09);
    --hairline:rgba(255,255,255,.10);
    --ink:#f2f1fb; --ink-muted:#a5a3c2; --ink-subtle:#6d6b8a;
    --violet:#8b7cf6; --sky:#5bc0f8; --glow:rgba(139,124,246,.35);
    --st-available:#34d399; --st-busy:#f87171; --st-meeting:#fbbf24;
    --st-focus:#60a5fa; --st-traveling:#c084fc; --st-offline:#71767f;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { color-scheme:dark; }
  body {
    font-family:'Inter',system-ui,sans-serif; color:var(--ink); font-size:13.5px; line-height:1.45;
    height:100vh; overflow:hidden; position:relative;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(91,192,248,.16), transparent 55%),
      radial-gradient(1100px 800px at 8% -15%, rgba(139,124,246,.28), transparent 55%),
      radial-gradient(900px 900px at 50% 120%, rgba(91,192,248,.08), transparent 60%),
      linear-gradient(180deg,#12102a 0%, var(--void) 55%);
  }

  .topbar {
    height:58px; display:flex; align-items:center; gap:20px;
    padding:0 22px; margin:12px 16px 0; border-radius:14px;
    background:var(--glass); border:1px solid var(--hairline);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 32px rgba(5,4,15,.45);
  }
  .logo { display:flex; align-items:center; gap:9px; font-weight:600; font-size:14.5px; letter-spacing:-0.01em; }
  .logo-mark {
    width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;
    background:linear-gradient(135deg,var(--violet),var(--sky));
    box-shadow:0 0 18px var(--glow);
  }
  nav { display:flex; gap:4px; }
  nav a {
    color:var(--ink-muted); text-decoration:none; font-size:13px; font-weight:500;
    padding:6px 14px; border-radius:999px; transition:all .15s;
  }
  nav a:hover { color:var(--ink); background:var(--glass-strong); }
  nav a.active {
    color:#fff; background:var(--glass-strong);
    box-shadow:inset 0 0 0 1px var(--hairline), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .btn-pill {
    border:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:600; color:#fff;
    padding:8px 18px; border-radius:999px;
    background:linear-gradient(135deg,var(--violet),#7048e8);
    box-shadow:0 0 20px var(--glow), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s, box-shadow .15s;
  }
  .btn-pill:hover { transform:translateY(-1px); box-shadow:0 4px 26px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-pill:active { transform:scale(.97); }

  .stage { padding:14px 16px 18px; height:calc(100vh - 84px); display:flex; flex-direction:column; }
  .panel {
    flex:1; border-radius:18px; overflow:auto; position:relative;
    background:var(--glass); border:1px solid var(--hairline);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 16px 48px rgba(5,4,15,.5);
    padding:18px 22px 26px;
  }
  .head-row { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  h1 { font-size:19px; font-weight:600; letter-spacing:-0.02em; }
  .week-label { font-family:var(--mono); font-size:12px; color:var(--ink-subtle); }
  .seg { margin-left:auto; display:flex; gap:2px; background:rgba(0,0,0,.25); border:1px solid var(--hairline); border-radius:999px; padding:3px; }
  .seg button { border:0; background:transparent; font:inherit; font-size:12px; font-weight:500; color:var(--ink-muted); padding:5px 14px; border-radius:999px; cursor:pointer; }
  .seg button.on { color:#fff; background:linear-gradient(135deg, rgba(139,124,246,.35), rgba(91,192,248,.25)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }

  .week-head { display:grid; grid-template-columns:52px repeat(7,1fr); padding-bottom:10px; }
  .day-head { text-align:center; }
  .day-name { font-size:10.5px; font-weight:600; color:var(--ink-subtle); text-transform:uppercase; letter-spacing:.08em; }
  .day-num { font-family:var(--mono); font-size:12.5px; width:27px;height:27px;line-height:27px;margin:5px auto 0;border-radius:50%;color:var(--ink-muted); }
  .day-head.today .day-num { background:linear-gradient(135deg,var(--violet),var(--sky)); color:#fff; box-shadow:0 0 14px var(--glow); }

  .grid { display:grid; grid-template-columns:52px repeat(7,1fr); }
  .gutter span { position:absolute; right:10px; transform:translateY(-50%); font-family:var(--mono); font-size:10px; color:var(--ink-subtle); }
  .gutter { position:relative; }
  .col { border-left:1px solid rgba(255,255,255,.06); position:relative; min-height:820px; }
  .col.today { background:linear-gradient(180deg, rgba(139,124,246,.07), transparent 30%); border-radius:10px 10px 0 0; }
  .hour-line { height:60px; border-bottom:1px solid rgba(255,255,255,.05); }
  .now-line { position:absolute; left:0; right:0; z-index:1; }
  .now-line::before { content:''; position:absolute; left:-4px; top:-3.5px; width:8px;height:8px;border-radius:50%;background:var(--sky); box-shadow:0 0 8px var(--sky); }
  .now-line::after { content:''; position:absolute; left:6px; right:0; top:-.5px; height:1px; background:linear-gradient(90deg,var(--sky),transparent); }

  .ev {
    position:absolute; left:4px; right:6px; border-radius:10px; padding:7px 10px;
    font-size:12px; overflow:hidden;
    background:var(--glass-strong); backdrop-filter:blur(6px);
    border:1px solid var(--hairline);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(5,4,15,.35);
  }
  .ev b { font-weight:600; display:block; }
  .ev-time { font-family:var(--mono); font-size:9.5px; opacity:.65; display:block; margin-top:1px; }
  .ev-work   { border-left:3px solid var(--st-available); }
  .ev-focus  { border-left:3px solid var(--st-focus);   background:rgba(96,165,250,.14); }
  .ev-meet   { border-left:3px solid var(--st-meeting); background:rgba(251,191,36,.12); }
  .ev-travel { border-left:3px solid var(--st-traveling); background:rgba(192,132,252,.14); }
  .ev-leave  { border-left:3px solid var(--st-busy);    background:rgba(248,113,113,.12); }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><div class="logo-mark">K</div>kairos</div>
  <nav>
    <a href="#" class="active">Calendar</a>
    <a href="c-team.html">Team</a>
    <a href="c-settings.html">Settings</a>
  </nav>
  <div class="right"><button class="btn-pill">＋ New event</button></div>
</header>

<div class="stage">
  <div class="panel">
    <div class="head-row">
      <h1>Calendar</h1>
      <span class="week-label">Feb 10 – 16 · Acme Inc</span>
      <div class="seg"><button>Day</button><button class="on">Week</button><button>Month</button></div>
    </div>
    <div class="week-head" id="wh"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
  const START=7, END=21, HH=60;
  const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], NUMS=[10,11,12,13,14,15,16];
  document.getElementById('wh').innerHTML = '<span></span>' + DAYS.map((d,i)=>
    `<div class="day-head${i===3?' today':''}"><div class="day-name">${d}</div><div class="day-num">${NUMS[i]}</div></div>`).join('');
  const g = document.createElement('div'); g.className='gutter';
  for(let h=START;h<=END;h++){const s=document.createElement('span');s.textContent=((h%12)||12)+(h<12?' AM':' PM');s.style.top=(h-START)*HH+'px';g.appendChild(s);}
  document.getElementById('grid').appendChild(g);
  for(let c=0;c<7;c++){
    const col=document.createElement('div'); col.className='col'+(c===3?' today':'');
    for(let h=START;h<END;h++) col.insertAdjacentHTML('beforeend','<div class="hour-line"></div>');
    if(c===3){
      const now=document.createElement('div'); now.className='now-line'; now.style.top=(10.62-START)*HH+'px'; col.appendChild(now);
      col.insertAdjacentHTML('beforeend',`
        <div class="ev ev-focus" style="top:${(9-START)*HH+3}px;height:${2*HH-6}px"><b>Focus Time</b><span class="ev-time">9:00 – 11:00</span></div>
        <div class="ev ev-meet" style="top:${(13-START)*HH+3}px;height:${HH-6}px"><b>Design sync</b><span class="ev-time">1:00 – 2:00 PM</span></div>`);
    }
    if([0,2,4].includes(c)) col.insertAdjacentHTML('beforeend',
      `<div class="ev ev-work" style="top:${(9-START)*HH+3}px;height:${8*HH-6}px"><b>Working hours</b><span class="ev-time">9:00 – 5:00</span></div>`);
    if(c===5) col.insertAdjacentHTML('beforeend',
      `<div class="ev ev-leave" style="top:${(9-START)*HH+3}px;height:${8*HH-6}px"><b>Leave · Vacation</b><span class="ev-time">all day</span></div>`);
    document.getElementById('grid').appendChild(col);
  }
</script>
</body>
</html>
