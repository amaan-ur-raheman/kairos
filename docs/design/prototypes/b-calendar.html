<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairos · Paper — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Direction B "Paper" — Cal.com-inspired light ─────────────── */
  :root {
    --canvas: #ffffff;
    --surface-soft: #f8f9fa;
    --surface-card: #f4f4f5;
    --hairline: #e6e7ea;
    --ink: #17181a;
    --ink-body: #3f4247;
    --ink-muted: #8b8e95;
    --ink-faint: #b3b6bc;
    --cta: #111111;          /* black CTA — Cal.com signature */
    --cta-hover: #2a2a2a;
    --accent: #111111;
    /* product status semantics — locked across directions */
    --st-available:#16a34a; --st-available-bg:#e8f7ee;
    --st-busy:#dc2626;      --st-busy-bg:#fdecec;
    --st-meeting:#d97706;   --st-meeting-bg:#fdf3e3;
    --st-focus:#2563eb;     --st-focus-bg:#e9f0fd;
    --st-traveling:#7c3aed; --st-traveling-bg:#f1eafd;
    --st-offline:#71767f;   --st-offline-bg:#eef0f2;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --display:'Inter Tight','Inter',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',system-ui,sans-serif;
    background:var(--canvas); color:var(--ink);
    font-size:14px; line-height:1.5;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── Top nav ── */
  .topbar {
    height:56px; flex-shrink:0; display:flex; align-items:center; gap:22px;
    padding:0 24px; border-bottom:1px solid var(--hairline);
  }
  .logo { display:flex; align-items:center; gap:8px; font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:-0.02em; }
  .logo-mark { width:22px; height:22px; border-radius:7px; background:var(--cta); display:grid; place-items:center; color:#fff; font-size:10px; font-weight:600; }
  nav.mainnav { display:flex; gap:2px; }
  nav.mainnav a {
    text-decoration:none; color:var(--ink-muted); font-size:13.5px; font-weight:500;
    padding:6px 12px; border-radius:8px;
  }
  nav.mainnav a:hover { color:var(--ink); background:var(--surface-card); }
  nav.mainnav a.active { color:var(--ink); background:var(--surface-card); }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .btn-cta {
    background:var(--cta); color:#fff; border:none; cursor:pointer; font:inherit;
    font-size:13px; font-weight:600; padding:8px 16px; border-radius:10px;
    transition:background .12s;
  }
  .btn-cta:hover { background:var(--cta-hover); }
  .me-chip { display:flex; align-items:center; gap:7px; cursor:pointer; padding:4px; border-radius:999px; }
  .me-chip:hover { background:var(--surface-card); }

  /* ── Content ── */
  .content-wrap { flex:1; overflow:auto; }
  .page-head {
    max-width:1180px; margin:0 auto; padding:28px 24px 18px;
    display:flex; align-items:baseline; gap:18px;
  }
  h1 { font-family:var(--display); font-size:26px; font-weight:600; letter-spacing:-0.02em; }
  .week-label { font-family:var(--mono); font-size:12.5px; color:var(--ink-muted); }
  .head-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .icon-btn {
    border:1px solid var(--hairline); background:#fff; border-radius:8px;
    width:30px; height:30px; cursor:pointer; color:var(--ink-body); font-size:14px;
  }
  .icon-btn:hover { background:var(--surface-soft); }
  .seg { display:flex; background:var(--surface-card); border-radius:9px; padding:2px; }
  .seg button { border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:500; color:var(--ink-muted); padding:5px 13px; border-radius:7px; cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.09); }

  .grid-wrap { max-width:1180px; margin:0 auto; padding:0 24px 32px; }
  .week-head { display:grid; grid-template-columns:52px repeat(7,1fr); position:sticky; top:0; z-index:2; background:var(--canvas); padding-bottom:10px; }
  .day-head { text-align:center; }
  .day-name { font-size:11px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.07em; }
  .day-num { font-family:var(--mono); font-size:13px; width:27px; height:27px; line-height:27px; margin:4px auto 0; border-radius:50%; color:var(--ink-body); }
  .day-head.today .day-num { background:var(--cta); color:#fff; }

  .grid { display:grid; grid-template-columns:52px repeat(7,1fr); position:relative; border-top:1px solid var(--hairline); }
  .gutter { position:relative; }
  .gutter span { position:absolute; right:10px; transform:translateY(-50%); font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
  .col { border-left:1px solid var(--hairline); position:relative; min-height:840px; }
  .col.today { background:var(--surface-soft); }
  .hour-line { height:60px; border-bottom:1px solid var(--hairline); }
  .half-line { position:absolute; left:0; right:0; border-bottom:1px dashed var(--hairline); }
  .now-line { position:absolute; left:0; right:0; z-index:1; pointer-events:none; }
  .now-line::before { content:''; position:absolute; left:-4px; top:-3.5px; width:8px; height:8px; border-radius:50%; background:var(--st-busy); }
  .now-line::after { content:''; position:absolute; left:6px; right:0; top:-0.5px; height:1.5px; background:var(--st-busy); }

  .ev { position:absolute; left:4px; right:6px; border-radius:8px; padding:6px 9px; font-size:12px; overflow:hidden; cursor:default; box-shadow:0 1px 2px rgba(17,17,17,.05); }
  .ev b { font-weight:600; display:block; letter-spacing:-0.01em; }
  .ev-time { font-family:var(--mono); font-size:10px; opacity:.65; display:block; margin-top:1px; }
  .ev-work   { background:var(--st-available-bg); color:#15803d; }
  .ev-focus  { background:var(--st-focus-bg); color:#1d4ed8; }
  .ev-meet   { background:var(--st-meeting-bg); color:#b45309; }
  .ev-travel { background:var(--st-traveling-bg); color:#6d28d9; }
  .ev-leave  { background:repeating-linear-gradient(-45deg,#fdecec 0 6px,#fbe4e4 6px 12px); color:#b91c1c; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><div class="logo-mark">K</div>kairos</div>
  <nav class="mainnav">
    <a href="#" class="active">Calendar</a>
    <a href="b-team.html">Team</a>
    <a href="b-settings.html">Settings</a>
  </nav>
  <div class="right">
    <button class="btn-cta">＋ New event</button>
    <div class="me-chip">
      <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#111,#444);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:600">AK</div>
    </div>
  </div>
</header>

<div class="content-wrap">
  <div class="page-head">
    <h1>Calendar</h1>
    <span class="week-label">Feb 10 – 16, 2025</span>
    <div class="head-actions">
      <button class="icon-btn">‹</button>
      <button class="icon-btn">›</button>
      <div class="seg" style="margin-left:6px">
        <button>Day</button><button class="on">Week</button><button>Month</button>
      </div>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="week-head" id="weekHead"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
  const START = 7, END = 21, HOUR_H = 60;
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const NUMS = [10,11,12,13,14,15,16];
  const wh = document.getElementById('weekHead');
  wh.innerHTML = '<span></span>' + DAYS.map((d,i) =>
    `<div class="day-head${i===3?' today':''}"><div class="day-name">${d}</div><div class="day-num">${NUMS[i]}</div></div>`
  ).join('');

  const gutter = document.createElement('div'); gutter.className = 'gutter';
  for (let h = START; h <= END; h++) {
    const s = document.createElement('span');
    s.textContent = ((h%12)||12) + (h<12?' AM':' PM');
    s.style.top = (h-START)*HOUR_H + 'px';
    gutter.appendChild(s);
  }
  document.getElementById('grid').appendChild(gutter);

  for (let c = 0; c < 7; c++) {
    const col = document.createElement('div');
    col.className = 'col' + (c===3?' today':'');
    for (let h = START; h < END; h++) {
      col.insertAdjacentHTML('beforeend', '<div class="hour-line"></div>');
      const half = document.createElement('div'); half.className='half-line';
      half.style.top = (h-START+0.5)*HOUR_H+'px'; col.appendChild(half);
    }
    if (c===3) {
      const now = document.createElement('div');
      now.className='now-line'; now.style.top=(10.62-START)*HOUR_H+'px';
      col.appendChild(now);
      col.insertAdjacentHTML('beforeend', `
        <div class="ev ev-focus" style="top:${(9-START)*HOUR_H+2}px;height:${2*HOUR_H-6}px"><b>Focus Time</b><span class="ev-time">9:00 – 11:00</span></div>
        <div class="ev ev-meet"  style="top:${(13-START)*HOUR_H+2}px;height:${HOUR_H-6}px"><b>Design sync</b><span class="ev-time">1:00 – 2:00 PM</span></div>`);
    }
    if ([0,2,4].includes(c)) {
      col.insertAdjacentHTML('beforeend',
        `<div class="ev ev-work" style="top:${(9-START)*HOUR_H+2}px;height:${8*HOUR_H-6}px"><b>Working hours</b><span class="ev-time">9:00 – 5:00</span></div>`);
    }
    if (c===5) {
      col.insertAdjacentHTML('beforeend',
        `<div class="ev ev-leave" style="top:${(9-START)*HOUR_H+2}px;height:${8*HOUR_H-6}px"><b>Leave · Vacation</b><span class="ev-time">all day</span></div>`);
    }
    document.getElementById('grid').appendChild(col);
  }
</script>
</body>
</html>
